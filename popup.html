<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Zen Picker</title>
<link rel="stylesheet" href="popup.css">
<main>
  <div class="search">
    <svg width="17" height="17" aria-hidden="true"><use href="#search"/></svg>
    <input id="query" role="combobox" aria-label="Search tabs and actions" placeholder="Search tabs and actions" aria-haspopup="listbox" aria-autocomplete="list" aria-expanded="true" aria-controls="results" autocomplete="off" spellcheck="false" autofocus>
  </div>
  <div id="results" role="listbox" aria-label="Tabs and actions"></div>
  <div id="status" role="status"></div>
  <footer><span><kbd>↑</kbd><kbd>↓</kbd> Select</span><span><kbd>↵</kbd> <span id="verb">Switch</span></span></footer>
</main>
<svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <symbol id="search" viewBox="0 0 20 20"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m13 13 4 4"/></symbol>
  <symbol id="page" viewBox="0 0 20 20"><rect x="2.5" y="3" width="15" height="14" rx="3"/><path d="M3 7h14"/></symbol>
  <symbol id="duplicate" viewBox="0 0 20 20"><rect x="7" y="7" width="10" height="10" rx="2"/><path d="M12 4H5a2 2 0 0 0-2 2v7"/></symbol>
  <symbol id="pin" viewBox="0 0 20 20"><path d="m10 3 7 7-2 1-2-1-3 4-4-4 4-3-1-2zM8 12l-5 5"/></symbol>
  <symbol id="mute" viewBox="0 0 20 20"><path d="M3 8h3l4-4v12l-4-4H3zM13 8l4 4m0-4-4 4"/></symbol>
  <symbol id="reload" viewBox="0 0 20 20"><path d="M16 8a6.5 6.5 0 1 0 .2 4M16 3v5h-5"/></symbol>
  <symbol id="close" viewBox="0 0 20 20"><path d="m5 5 10 10m0-10L5 15"/></symbol>
</svg>
<script type="module" src="window-picker.js"></script>
</html>
